<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e2b17">
  <title>Berbert Pest Control</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="img/app-apple-180.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="carregando" class="tela-cheia"><div class="spinner"></div></div>

  <div id="tela-login" class="tela-cheia" hidden>
    <form class="login-cartao" id="form-login">
      <img src="img/logo-escura.webp" alt="Berbert Pest Control" class="login-logo">
      <label>E-mail<input type="email" name="email" autocomplete="username" required></label>
      <label>Senha<input type="password" name="senha" autocomplete="current-password" required></label>
      <div class="erro" id="login-erro" hidden></div>
      <button class="btn">Entrar</button>
    </form>
  </div>

  <div id="tela-aviso" class="tela-cheia" hidden>
    <div class="login-cartao">
      <img src="img/logo-escura.webp" alt="Berbert Pest Control" class="login-logo">
      <div id="aviso-texto"></div>
    </div>
  </div>

  <div id="app" hidden>
    <header class="topo">
      <button class="menu-btn" id="menu-btn" aria-label="Abrir menu"></button>
      <img src="img/logo-clara.webp" alt="Berbert Pest Control" class="topo-logo">
      <div class="notif" id="notif" hidden>
        <button class="notif-btn" id="notif-btn" aria-label="Notificações" aria-expanded="false"></button>
        <div class="notif-painel" id="notif-painel" hidden></div>
      </div>
    </header>
    <aside class="menu" id="menu">
      <nav id="menu-links"></nav>
      <div class="perfil" id="perfil">
        <div class="perfil-menu" id="perfil-menu" hidden></div>
        <button class="perfil-btn" id="perfil-btn" aria-haspopup="true" aria-expanded="false"></button>
      </div>
    </aside>
    <main id="view"></main>
  </div>

  <div class="modal-fundo" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-topo">
        <h2 id="modal-titulo"></h2>
        <button class="fechar" id="modal-fechar" aria-label="Fechar">&times;</button>
      </div>
      <div id="modal-corpo"></div>
    </div>
  </div>

  <div id="aviso-flutuante" hidden></div>
  <div id="nova-versao" hidden>
    <span>Há uma versão nova do sistema.</span>
    <button class="btn peq" id="nova-versao-btn">Atualizar agora</button>
  </div>
  <div id="impressao"></div>

  <script src="js/vendor/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/faes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
